<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Nova &amp; Nest</title>
  <meta name="description" content="Trending gadgets shipped free worldwide, with a 30-day money-back guarantee.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="container page">
      <h1>Checkout</h1>
      <div class="two-col">
        <form id="checkout-form" class="panel" novalidate>
          <div id="mode-notice"></div>
          <h2>Contact</h2>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <h2 style="margin-top:24px">Shipping address</h2>
          <div class="row">
            <div><label for="firstName">First name</label><input id="firstName" name="firstName" autocomplete="given-name" required></div>
            <div><label for="lastName">Last name</label><input id="lastName" name="lastName" autocomplete="family-name" required></div>
          </div>
          <label for="address1">Address</label>
          <input id="address1" name="address1" autocomplete="address-line1" required>
          <label for="address2">Apartment, suite, etc. (optional)</label>
          <input id="address2" name="address2" autocomplete="address-line2">
          <div class="row">
            <div><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required></div>
            <div><label for="state">State / Province</label><input id="state" name="state" autocomplete="address-level1"></div>
          </div>
          <div class="row">
            <div><label for="postalCode">ZIP / Postal code</label><input id="postalCode" name="postalCode" autocomplete="postal-code" required></div>
            <div><label for="country">Country</label>
              <select id="country" name="country" autocomplete="country" required>
                <option value="US">United States</option><option value="CA">Canada</option><option value="GB">United Kingdom</option>
                <option value="AU">Australia</option><option value="NZ">New Zealand</option><option value="IE">Ireland</option>
                <option value="DE">Germany</option><option value="FR">France</option><option value="NL">Netherlands</option>
                <option value="ES">Spain</option><option value="IT">Italy</option><option value="SE">Sweden</option>
              </select>
            </div>
          </div>
          <label for="phone">Phone (optional, for delivery updates)</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
          <button class="btn btn-block" style="margin-top:24px" type="submit" id="pay-btn">Continue to payment</button>
          <p class="error" id="checkout-error" role="alert"></p>
        </form>
        <aside class="panel" id="summary"><p class="muted">Loading…</p></aside>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/common.js"></script>
  <script src="/js/summary.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
