<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Astronaut galaxy projector casting stars">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#3b2a7a"/><stop offset=".55" stop-color="#1a1440"/><stop offset="1" stop-color="#0b0a1f"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity=".75"/><stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d3ff" stop-opacity=".6"/><stop offset="1" stop-color="#34d3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dcef"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d1b69"/><stop offset=".5" stop-color="#7a3cff"/><stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b58cff" stop-opacity=".55"/><stop offset="1" stop-color="#b58cff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <ellipse cx="190" cy="170" rx="230" ry="120" fill="url(#neb1)"/>
  <ellipse cx="430" cy="140" rx="220" ry="110" fill="url(#neb2)"/>
  <g fill="#fff">
    <circle cx="60" cy="60" r="2"/><circle cx="140" cy="100" r="1.5"/><circle cx="250" cy="50" r="2.5"/>
    <circle cx="330" cy="120" r="1.5"/><circle cx="420" cy="60" r="2"/><circle cx="520" cy="110" r="2.5"/>
    <circle cx="560" cy="40" r="1.5"/><circle cx="90" cy="200" r="1.5"/><circle cx="480" cy="210" r="2"/>
    <circle cx="200" cy="240" r="1.5"/><circle cx="380" cy="230" r="1.2"/><circle cx="30" cy="300" r="2"/>
    <circle cx="570" cy="290" r="1.5"/><circle cx="300" cy="190" r="2"/><circle cx="160" cy="30" r="1.2"/>
  </g>
  <path d="M300 330 L120 0 L480 0 Z" fill="url(#beam)"/>
  <!-- astronaut -->
  <ellipse cx="300" cy="545" rx="150" ry="18" fill="#000" opacity=".35"/>
  <rect x="215" y="420" width="170" height="120" rx="50" fill="url(#suit)"/>
  <rect x="265" y="450" width="70" height="45" rx="10" fill="#e6e8f7" stroke="#b8bce0" stroke-width="3"/>
  <circle cx="285" cy="472" r="7" fill="#ff5fa2"/><circle cx="315" cy="472" r="7" fill="#34d3ff"/>
  <circle cx="300" cy="340" r="105" fill="url(#suit)"/>
  <ellipse cx="300" cy="345" rx="78" ry="66" fill="url(#visor)"/>
  <ellipse cx="270" cy="318" rx="22" ry="12" fill="#fff" opacity=".45" transform="rotate(-25 270 318)"/>
  <g fill="#fff" opacity=".9"><circle cx="320" cy="360" r="2"/><circle cx="335" cy="330" r="1.5"/><circle cx="290" cy="375" r="1.5"/></g>
  <rect x="190" y="320" width="24" height="50" rx="10" fill="#d9dcef"/>
  <rect x="386" y="320" width="24" height="50" rx="10" fill="#d9dcef"/>
</svg>
