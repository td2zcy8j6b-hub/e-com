# Render Blueprint: one-click hosting for the store.
# Deploy with the "Deploy to Render" button in README.md.
services:
  - type: web
    name: nova-and-nest
    runtime: node
    # Free plan: fine for previewing, but it has no persistent disk, so
    # data/orders.json is wiped on every restart or redeploy. Before taking
    # real orders, switch to `plan: starter` and restore the disk below.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STORE_NAME
        value: Nova & Nest
      - key: SUPPORT_EMAIL
        value: support@example.com
      # Random password for /admin.html; view it under the service's Environment tab.
      - key: ADMIN_PASSWORD
        generateValue: true
    # Paid plans only:
    # disk:
    #   name: orders
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
